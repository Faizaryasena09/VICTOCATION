<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="shortcut icon" href="Data/logo.png" type="image/png" />
    <title>Masuk - VICTOCATION</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <style media="screen">
        *, *:before, *:after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: radial-gradient(circle at 50% 30%, #1e3a8a 0%, #090e17 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        form {
            height: auto;
            min-height: 380px;
            width: 90%;
            max-width: 420px;
            background-color: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
            padding: 35px 30px;
            color: #ffffff;
            text-align: center;
        }
        form h3 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        button {
            margin-top: 30px;
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #ffffff;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.5);
        }
    </style>
</head>
<body>
    <script language="JavaScript">
        function pass() {
            var coba = 1;
            do {
                var p = prompt("Silahkan tuliskan password:", "");
                if (p == "vctjaya") {
                    alert("Password benar! Mengalihkan ke galeri...");
                    window.location.href = "open2.html";
                    break;
                } else if (p !== null) {
                    alert("Password Salah! Silahkan coba lagi.");
                } else {
                    break;
                }
                if (coba == 3) {
                    alert("Maaf, batas percobaan telah habis.");
                    history.go(-1);
                }
                coba++;
            } while (coba <= 3);
        }             
    </script>
    <form onsubmit="return false;">
        <div style="margin-bottom: 20px;">
            <img src="Data/logo.png" width="70" style="border-radius: 10px; background: rgba(37,99,235,0.4); padding: 5px;">
        </div>
        <h3>Masuk Galeri</h3>
        <p style="font-size: 13px; color: #cbd5e1; margin-top: 5px;">Masukkan password angkatan VICTOCATION</p>
        <button type="button" onclick="pass()">Buka Arsip Foto</button>
        <center>
            <h2 style="font-size: 12px; color: #94a3b8; font-weight: 400; margin-top: 15px;">*Pastikan popup browser diizinkan</h2>
            <div style="margin-top: 15px;">
                <a href="index.html" style="color: #60a5fa; text-decoration: none; font-size: 14px; font-weight: 500;">
                    <i class="fas fa-arrow-left"></i> Kembali ke Beranda
                </a>
            </div>
        </center> 
    </form>
</body>
</html>
